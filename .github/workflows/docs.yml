name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build docs for all versions
        run: |
          set -e
          mkdir -p site

          # 1. Extract clean list of the 10 most recent tags
          TAGS=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+' | sort -V | tail -10)
          
          # Create comma-separated list for the switcher (latest, 1.2.3, 1.2.2...)
          VERS_LIST="latest$(for t in $TAGS; do echo -n ",${t#v}"; done)"
          
          echo "Building versions: $VERS_LIST"

          # 2. Build 'latest' from current branch
          export DOC_VERSIONS="$VERS_LIST"
          export CURRENT_DOC_VERSION="latest"
          uv run --extra dev sphinx-build -b html docs site/latest

          # 3. Build each tag in temporary clones
          for tag in $TAGS; do
            ver=${tag#v}
            echo "### Building version $ver ###"
            
            # Create temporary directory for this version
            TMPDIR=$(mktemp -d)
            
            # Clone just this tag (shallow clone for speed)
            git clone --depth 1 --branch "$tag" . "$TMPDIR"
            
            # Build if docs exist
            if [ -d "$TMPDIR/docs" ]; then
              cd "$TMPDIR"
              export CURRENT_DOC_VERSION="$ver"
              uv run --extra dev sphinx-build -b html docs "$GITHUB_WORKSPACE/site/$ver" || echo "Warning: Build failed for $ver"
              cd "$GITHUB_WORKSPACE"
            else
              echo "No docs/ directory in $tag, skipping"
            fi
            
            # Clean up temporary clone
            rm -rf "$TMPDIR"
          done

          # 4. Generate Root Redirect & Version Picker
          BUILT_VERS=$(ls -d site/*/ 2>/dev/null | xargs -n1 basename | sort -Vr)
          
          cat <<EOF > site/index.html
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=latest/">
          <title>picobuild</title>
          <style>
            body{font-family:system-ui,sans-serif;max-width:40em;margin:2em auto;padding:0 1em;line-height:1.5;background:#f9f9f9;color:#333}
            a{color:#2980b9;text-decoration:none}a:hover{text-decoration:underline}
            ul{list-style:none;padding:0}li{margin:.5em 0;padding:.5em;background:#fff;border-radius:4px;border:1px solid #eee}
          </style></head><body>
          <h1>picobuild</h1><p>Redirecting to <a href="latest/">latest documentation</a>...</p>
          <h3>Available Versions:</h3><ul>
          $(for v in $BUILT_VERS; do echo "<li><a href=\"$v/\">$v</a></li>"; done)
          </ul></body></html>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4