# Publish to PyPI when a GitHub Release is published.
# Builds sdist + wheel for Python 3.13 and 3.14 (multi-version dist/), then publishes.
# One-time: Add Trusted Publisher on PyPI for this repo (workflow: python-publish.yml).

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python and build sdist
        run: |
          uv python install 3.14
          uv build --sdist --out-dir dist

      - name: Build manylinux / musllinux wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          output-dir: dist
          extras: "uv"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
  
  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/picobuild

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: "true"