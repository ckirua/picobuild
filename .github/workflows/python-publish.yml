# Publish to PyPI when a GitHub Release is published.
# Builds sdist + wheel for Python 3.13 and 3.14 (multi-version dist/), then publishes.
# One-time: Add Trusted Publisher on PyPI for this repo (workflow: python-publish.yml).

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python and build sdist
        run: |
          # Create dist/ directory if it doesn't exist
          mkdir -p dist

          # Define Python versions once (easy to edit/expand)
          VERSIONS=(3.13 3.14)
          T_SUFFIX="t"
          ALL_VERSIONS=("${VERSIONS[@]}" "${VERSIONS[@]/%/$T_SUFFIX}")

          # Install all CPython (and threaded) interpreters at once
          uv python install "${ALL_VERSIONS[@]}"

          # -- SINGLE for py LOOP, reducing overhead --

          for py in "${ALL_VERSIONS[@]}"; do
            # Install requirements (main and dev)
            UV_PYTHON="$py" uv pip install -r requirements.txt
            UV_PYTHON="$py" uv pip install -r requirements-dev.txt

            # Build sdist only ONCE, on the highest version (non-threaded variant)
            if [[ "$py" == "${VERSIONS[-1]}" ]]; then
              UV_PYTHON="$py" uv build --sdist --out-dir dist/"$py"
            fi

            # Always build the wheel for this interpreter
            UV_PYTHON="$py" uv build --wheel --out-dir dist/"$py"

            # Move wheels to dist/ and give normalized manylinux tags
            tag="manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64"
            pyver="${py/./}"    # E.g., 3.13 → 313 or 3.13t → 313t
            
            # Only proceed if directory and wheels exist
            if [ -d "dist/$py" ]; then
              for wheel in dist/"$py"/*.whl; do
                # Skip if glob didn't match any files
                [ -e "$wheel" ] || continue
                
                base=$(basename "$wheel")
                if [[ "$base" =~ ^(.*)-cp${pyver}-cp${pyver}m-any\.whl$ ]]; then
                  newbase="${BASH_REMATCH[1]}-cp${pyver}-cp${pyver}-${tag}.whl"
                elif [[ "$base" =~ ^(.*)-py3-none-any\.whl$ ]]; then
                  newbase="${BASH_REMATCH[1]}-cp${pyver}-cp${pyver}-${tag}.whl"
                else
                  newbase="$base"
                fi
                mv "$wheel" "dist/$newbase"
              done
              
              # Remove wheel subdir if empty
              rmdir "dist/$py" 2>/dev/null || true
            fi
          done

          # Move sdist .tar.gz up to top dist/ if present
          highest_ver="${VERSIONS[-1]}"
          sdist_dir="dist/$highest_ver"
          
          if [ -d "$sdist_dir" ]; then
            for sdist in "$sdist_dir"/*.tar.gz; do
              [ -e "$sdist" ] && mv "$sdist" dist/
            done
          fi

          # Remove all numbered subdirectories (and 't' variants) from dist/
          find dist -mindepth 1 -maxdepth 1 -type d -regex 'dist/[0-9]+\.[0-9]+t*' -exec rm -rf {} +

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
  
  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/picobuild

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: "true"